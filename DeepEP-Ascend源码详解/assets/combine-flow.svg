<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330" font-family="Microsoft YaHei,Segoe UI,sans-serif"><title>combine-flow</title><rect width="100%" height="100%" fill="white"/><text x="45" y="28" dominant-baseline="text-before-edge" font-size="34" font-weight="700" fill="#17324d">Combine 两级归约与回传全流程</text><text x="45" y="81" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#52677d">输入 expert_output 必须与 handle 的 expanded slots 对齐；路由权重乘法由调用方完成。</text><polyline points="45,1258 1555,1258" fill="none" stroke="#cad5df" stroke-width="2"/><text x="45" y="1270" dominant-baseline="text-before-edge" font-size="17" font-weight="400" fill="#52677d">源码：csrc/buffers/ep.hpp · combine.hpp · combine_utils.hpp · combine_reduce_epilogue.hpp</text><text x="45" y="1298" dominant-baseline="text-before-edge" font-size="16" font-weight="400" fill="#52677d">基线 3b25377 · 静态执行依赖示意，位置与长度不表示实测耗时或物理字节比例</text><rect x="45" y="135" width="1510" height="120" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="147" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">① Host 准备</text><text x="60" y="187" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">BF16 x[R_expand,H] + handle.recv_src_metadata + rank_psum；可选 expanded weights 与 0/1/2 个 bias</text><text x="60" y="216" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">分配 send_buffer；context-&gt;buffer 复用为 combine reduce_buffer。</text><polyline points="800,255 800,290" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,290 794.345448056554,278.2941876694152 805.654551943446,278.2941876694152" fill="#52677d"/><rect x="45" y="290" width="1510" height="145" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="302" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">② combine_impl 调度与 SIMT</text><text x="60" y="342" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">基础 barrier → source-rank 流分配给各 AIV（swizzle + 步长 V）→ round-robin task</text><text x="60" y="371" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">每 task 最多 8 token；双 metadata stage；SIMT 压紧有效 expanded slots，并构造 WQE。</text><polyline points="800,435 800,470" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,470 794.345448056554,458.2941876694152 805.654551943446,458.2941876694152" fill="#52677d"/><polyline points="800,450 280,450 280,470" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="280,470 274.345448056554,458.2941876694152 285.654551943446,458.2941876694152" fill="#52677d"/><polyline points="800,450 1320,450 1320,470" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1320,470 1314.345448056554,458.2941876694152 1325.654551943446,458.2941876694152" fill="#52677d"/><rect x="45" y="470" width="470" height="200" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="482" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">③a 远端且单专家</text><text x="60" y="522" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">num_slots=1</text><text x="60" y="550" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">SGE 直接指向 x[first_slot]</text><text x="60" y="578" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">不搬运 hidden 到 send_buffer</text><text x="60" y="606" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">无需局部求和</text><rect x="565" y="470" width="470" height="200" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="580" y="482" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">③b 远端且多专家</text><text x="580" y="522" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">num_slots≥2</text><text x="580" y="550" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">MTE2 → UB RingReducer</text><text x="580" y="578" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">V 归约 → BF16 partial</text><text x="580" y="606" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">MTE3 → send_buffer</text><rect x="1085" y="470" width="470" height="200" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="1100" y="482" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">③c 目标是 self</text><text x="1100" y="522" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">单专家：本地拷贝</text><text x="1100" y="550" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">多专家：本地归约</text><text x="1100" y="578" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">写本地 reduce_buffer</text><text x="1100" y="606" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">不走 self URMA</text><polyline points="280,670 280,710 800,710 800,750" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,750 794.345448056554,738.2941876694152 805.654551943446,738.2941876694152" fill="#52677d"/><polyline points="800,670 800,750" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,750 794.345448056554,738.2941876694152 805.654551943446,738.2941876694152" fill="#52677d"/><polyline points="1320,670 1320,710 800,710" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,710 811.7058123305848,704.345448056554 811.7058123305848,715.654551943446" fill="#52677d"/><rect x="45" y="750" width="1510" height="145" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="60" y="762" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">④ 发布与回传</text><text x="60" y="802" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">每 8 个远端 task：等 MTE3 → 更新 SQ head → doorbell；最终强序 NOP 请求 CQE，并补齐 4 WQEBB</text><text x="60" y="831" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">每 token / 专家 rank 只回传一个 partial，写 [slot_group, source_token]；issue 返回仍可能有 URMA 飞行。</text><polyline points="800,895 800,930" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,930 794.345448056554,918.2941876694152 805.654551943446,918.2941876694152" fill="#52677d"/><rect x="45" y="930" width="1510" height="145" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="942" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">⑤ combine_reduce_epilogue_impl</text><text x="60" y="982" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">CQ drain + 跨 rank barrier → 反向扫描 top-k，保留每 rank 的最后一个槽</text><text x="60" y="1011" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">加载 bias0、bias1、各有效 rank partial → RingReducer → combined_x[T,H]</text><polyline points="800,1075 800,1110" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,1110 794.345448056554,1098.2941876694151 805.654551943446,1098.2941876694151" fill="#52677d"/><rect x="45" y="1110" width="1510" height="110" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="60" y="1122" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">⑥ 可选恢复 weights</text><text x="60" y="1162" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">各 partial 对不属于自己的 top-k 位置写 0；按 uint32 bits 做 OR 恢复 [T,K]，不是用 weights 乘 hidden。</text></svg>