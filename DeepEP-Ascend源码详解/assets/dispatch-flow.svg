<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" font-family="Microsoft YaHei,Segoe UI,sans-serif"><title>dispatch-flow</title><rect width="100%" height="100%" fill="white"/><text x="45" y="28" dominant-baseline="text-before-edge" font-size="34" font-weight="700" fill="#17324d">Dispatch 全链路与两类接收布局</text><text x="45" y="81" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#52677d">实线表示执行/数据依赖；右侧 cached 分支复用 handle；默认完成等待位于 epilogue。</text><polyline points="45,1408 1555,1408" fill="none" stroke="#cad5df" stroke-width="2"/><text x="45" y="1420" dominant-baseline="text-before-edge" font-size="17" font-weight="400" fill="#52677d">源码：buffers/ep.py · csrc/buffers/ep.hpp · impls/ep/dispatch.hpp · dispatch_copy_epilogue.hpp</text><text x="45" y="1448" dominant-baseline="text-before-edge" font-size="16" font-weight="400" fill="#52677d">基线 3b25377 · 静态执行依赖示意，位置与长度不表示实测耗时或物理字节比例</text><rect x="45" y="135" width="1030" height="115" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="147" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">① Python / Host 准备</text><text x="60" y="187" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">检查 x、top-k、E/P、M；分配 metadata_send_buffer、slot/SGE map 和 count tensors</text><rect x="1110" y="135" width="445" height="220" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="1125" y="147" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">Cached handle 路径</text><text x="1125" y="187" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">复用 topk_idx、rank/expert psum</text><text x="1125" y="215" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">复用 dst slot / SGE map</text><text x="1125" y="243" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">复用 recv_src_metadata</text><text x="1125" y="271" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">不重新交换路由计数</text><polyline points="550,250 550,285" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="550,285 544.345448056554,273.2941876694152 555.654551943446,273.2941876694152" fill="#52677d"/><rect x="45" y="285" width="1030" height="145" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="297" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">② dispatch_impl：每 AIV 一个容量片段</text><text x="60" y="337" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">基础 barrier → SIMT 去重路由 / count / SQE；标量与 MTE 打包 metadata、复制本地 hidden</text><text x="60" y="366" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">core 0 额外汇总 expert count；core 1 额外汇总 rank count</text><polyline points="1110,335 1088,335 1088,380 1075,380" fill="none" stroke="#52677d" stroke-width="3" stroke-dasharray="7 5"/><polygon points="1075,380 1086.7058123305849,374.345448056554 1086.7058123305849,385.654551943446" fill="#52677d"/><polyline points="550,430 550,447 290,447 290,465" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="290,465 284.345448056554,453.2941876694152 295.654551943446,453.2941876694152" fill="#52677d"/><polyline points="550,447 830,447 830,465" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="830,465 824.345448056554,453.2941876694152 835.654551943446,453.2941876694152" fill="#52677d"/><rect x="45" y="465" width="490" height="165" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="477" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">③ 远端路径：URMA</text><text x="60" y="517" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">hidden 直接读原 x</text><text x="60" y="546" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">metadata 读 staging</text><text x="60" y="575" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">SQE 发布 → advance SQ → doorbell</text><rect x="585" y="465" width="490" height="165" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="600" y="477" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">③ self 路径：本地复制</text><text x="600" y="517" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">hidden：GM → UB → GM</text><text x="600" y="546" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">metadata：SIMT 从 staging 复制</text><text x="600" y="575" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">无需 self URMA 传输</text><rect x="1110" y="465" width="445" height="165" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="1125" y="477" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">issue 返回 ≠ 网络完成</text><text x="1125" y="517" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">epilogue 闭包保留源张量</text><text x="1125" y="545" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">允许独立计算与 URMA 飞行重叠</text><text x="1125" y="573" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">不能提前修改 x 或复用窗口</text><polyline points="290,630 290,665 550,665 550,700" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="550,700 544.345448056554,688.2941876694152 555.654551943446,688.2941876694152" fill="#52677d"/><polyline points="830,630 830,665 550,665" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="550,665 561.7058123305848,659.345448056554 561.7058123305848,670.654551943446" fill="#52677d"/><rect x="45" y="700" width="1030" height="110" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="712" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">④ 目标 rank 通信窗口：source-major</text><text x="60" y="752" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">[source 0: M 槽] [source 1: M 槽] …；每 token / 目标 rank 仅一条 record</text><polyline points="550,810 550,845" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="550,845 544.345448056554,833.2941876694152 555.654551943446,833.2941876694152" fill="#52677d"/><rect x="45" y="845" width="1030" height="145" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="857" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">⑤ 立即 epilogue 或 pending.wait()</text><text x="60" y="897" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">可选 Host count wait → 分配精确大小 / 上界输出</text><text x="60" y="926" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">copy epilogue：CQ drain + 跨 rank barrier → histogram / prefix → 专家展开</text><rect x="1110" y="845" width="445" height="145" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="1125" y="857" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">性能测试开关</text><text x="1125" y="897" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">barrier_in_prologue=True</text><text x="1125" y="925" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">将 drain 放 issue 尾部</text><text x="1125" y="953" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">epilogue 不重复 drain</text><polyline points="550,990 550,1025" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="550,1025 544.345448056554,1013.2941876694152 555.654551943446,1013.2941876694152" fill="#52677d"/><rect x="45" y="1025" width="1030" height="145" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="1037" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">⑥ 普通输出：expert-major</text><text x="60" y="1077" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">recv_x / SF / weight：[expert 0 有效 + pad] [expert 1 有效 + pad] …</text><text x="60" y="1106" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">metadata：[K 个 expanded slots, source_global_idx, master_topk_idx]</text><polyline points="550,1170 550,1205" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="550,1205 544.345448056554,1193.2941876694151 555.654551943446,1193.2941876694151" fill="#52677d"/><rect x="45" y="1205" width="1510" height="145" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="60" y="1217" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">⑦ Python 收尾与模型接入</text><text x="60" y="1257" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">可选 SF 列主序转换、deterministic_sort；返回 recv_x、None、recv_weights、handle</text><text x="60" y="1286" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">外部专家 GEMM / 激活 / 路由权重乘法在通信库之外执行。</text></svg>