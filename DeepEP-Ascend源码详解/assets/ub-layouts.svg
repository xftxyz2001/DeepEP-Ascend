<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" font-family="Microsoft YaHei,Segoe UI,sans-serif"><title>ub-layouts</title><rect width="100%" height="100%" fill="white"/><text x="45" y="28" dominant-baseline="text-before-edge" font-size="34" font-weight="700" fill="#17324d">四个 kernel 的 UB 分区与空间复用</text><text x="45" y="81" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#52677d">每 AIV 独立 UB；实际容量由运行时查询，图中区块不按大小比例。</text><polyline points="45,1358 1555,1358" fill="none" stroke="#cad5df" stroke-width="2"/><text x="45" y="1370" dominant-baseline="text-before-edge" font-size="17" font-weight="400" fill="#52677d">源码：DispatchUBLayout / UBLayoutWithBuffer / copy epilogue constants / CombineUBLayout / RingReducer</text><text x="45" y="1398" dominant-baseline="text-before-edge" font-size="16" font-weight="400" fill="#52677d">基线 3b25377 · 静态执行依赖示意，位置与长度不表示实测耗时或物理字节比例</text><text x="45" y="145" dominant-baseline="text-before-edge" font-size="27" font-weight="700" fill="#17324d">Dispatch issue</text><rect x="45" y="195" width="730" height="150" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="207" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">控制区</text><text x="60" y="247" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">expert/rank histogram、rank prefix</text><text x="60" y="276" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">entry/SGE map、Jetty/peer、ready flags</text><rect x="45" y="360" width="730" height="125" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="372" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">metadata stages</text><text x="60" y="412" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">每批64或4 token；最多8 stage</text><text x="60" y="441" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">独立 GM staging 的打包缓冲</text><rect x="45" y="500" width="730" height="125" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="512" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">hidden stages</text><text x="60" y="552" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">剩余预算分配，最多8 stage</text><text x="60" y="581" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">仅 self hidden copy 经这里</text><text x="825" y="145" dominant-baseline="text-before-edge" font-size="27" font-weight="700" fill="#17324d">Dispatch copy epilogue</text><rect x="825" y="195" width="730" height="150" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="840" y="207" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">ExpertState</text><text x="840" y="247" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">两组 histogram bins（256/512）</text><text x="840" y="276" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">count 位置后复用为 next_dst_slot</text><rect x="825" y="360" width="730" height="125" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="840" y="372" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">scratch 按阶段复用</text><text x="840" y="412" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">先：4×32KiB histogram</text><text x="840" y="441" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">后：约64KiB / token stage</text><rect x="825" y="500" width="730" height="125" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="840" y="512" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">metadata + zero</text><text x="840" y="552" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">2个 metadata stage；可选 zero buffer</text><text x="840" y="581" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">token stages + 2 ≤ 8 事件预算</text><text x="45" y="750" dominant-baseline="text-before-edge" font-size="27" font-weight="700" fill="#17324d">Combine issue</text><rect x="45" y="800" width="730" height="150" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="812" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">固定控制区</text><text x="60" y="852" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">Jetty/peer、remaining、next_recv_slot</text><text x="60" y="881" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">2 stages × 8 tokens × UB metadata</text><rect x="45" y="965" width="730" height="125" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="977" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">hidden ring</text><text x="60" y="1017" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">floor(剩余UB / (2H))，最多32槽</text><text x="60" y="1046" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">至少能容纳本地 K 个输入</text><rect x="45" y="1105" width="730" height="125" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="60" y="1117" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">跨流水槽锁</text><text x="60" y="1157" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">MTE2 load → V reduce → MTE3 store</text><text x="60" y="1186" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">slot循环复用，不等于task stage</text><text x="825" y="750" dominant-baseline="text-before-edge" font-size="27" font-weight="700" fill="#17324d">Combine reduce epilogue</text><rect x="825" y="800" width="730" height="150" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="840" y="812" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">整块 UB：hidden + weights ring</text><text x="840" y="852" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">每槽 2H + align(4K,32) 字节</text><text x="840" y="881" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">slot数 = min(32, floor(UB/C))</text><rect x="825" y="965" width="730" height="125" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="840" y="977" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">容纳 rank partial 与 bias</text><text x="840" y="1017" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">要求 min(P,K)+2 ≤ ring slots</text><text x="840" y="1046" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">+2 对应最多两个 bias 输入</text><rect x="825" y="1105" width="730" height="125" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="840" y="1117" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">额外 weight 操作</text><text x="840" y="1157" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">对 partial 尾部 uint32 做 OR</text><text x="840" y="1186" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">输出 hidden 和 [T,K] weights</text></svg>