<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" font-family="Microsoft YaHei,Segoe UI,sans-serif"><title>combine-layout</title><rect width="100%" height="100%" fill="white"/><text x="45" y="28" dominant-baseline="text-before-edge" font-size="34" font-weight="700" fill="#17324d">Combine reduce window 的两个槽组分支</text><text x="45" y="81" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#52677d">每个 token / 专家 rank 只保留一个 partial；同一通信窗口由 dispatch 与 combine 分阶段复用。</text><polyline points="45,1178 1555,1178" fill="none" stroke="#cad5df" stroke-width="2"/><text x="45" y="1190" dominant-baseline="text-before-edge" font-size="17" font-weight="400" fill="#52677d">源码：combine.hpp · slot_group_idx / remote_offset；combine_reduce_epilogue.hpp · master_slot_mask</text><text x="45" y="1218" dominant-baseline="text-before-edge" font-size="16" font-weight="400" fill="#52677d">基线 3b25377 · 静态执行依赖示意，位置与长度不表示实测耗时或物理字节比例</text><rect x="45" y="135" width="1510" height="135" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="147" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">① 同 rank 专家先合并</text><text x="60" y="187" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">原路由 [0,1,2]、每 rank 两专家：rank0 产生 partial0=reduce(y0,y1)，rank1 产生 partial1=y2</text><text x="60" y="217" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">最后一个属于 rank0 的 top-k 下标为1，属于 rank1 的为2；它们是 master_idx。</text><polyline points="800,270 800,290 410,290 410,310" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="410,310 404.345448056554,298.2941876694152 415.654551943446,298.2941876694152" fill="#52677d"/><polyline points="800,290 1190,290 1190,310" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1190,310 1184.345448056554,298.2941876694152 1195.654551943446,298.2941876694152" fill="#52677d"/><rect x="45" y="310" width="730" height="250" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="322" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">②a P &lt; K：槽组是专家 rank</text><text x="60" y="362" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">例 P=2，K=3，组数=min(P,K)=2</text><text x="60" y="392" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">group0：[partial0(t0)][t1][t2]…[M-1]</text><text x="60" y="422" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">group1：[partial1(t0)][t1][t2]…[M-1]</text><text x="60" y="452" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">slot_group = 产生 partial 的专家 rank</text><text x="60" y="482" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">source_token_idx 保持原 token 位置</text><rect x="825" y="310" width="730" height="250" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="840" y="322" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">②b P ≥ K：槽组是 master top-k</text><text x="840" y="362" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">例 P=4，K=3，组数=min(P,K)=3</text><text x="840" y="392" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">group0：[本例不读][t1][t2]…[M-1]</text><text x="840" y="422" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">group1：[partial0(t0)][t1][t2]…[M-1]</text><text x="840" y="452" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">group2：[partial1(t0)][t1][t2]…[M-1]</text><text x="840" y="482" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">slot_group = master_topk_idx</text><rect x="45" y="610" width="1510" height="115" rx="10" fill="#edf1f5" stroke="#778696" stroke-width="2"/><text x="60" y="622" dominant-baseline="text-before-edge" font-size="24" font-weight="700" fill="#17324d">远端地址公式</text><text x="60" y="662" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">remote_workspace_base + reduce_buffer_offset + (slot_group×M + source_token_idx)×C</text><text x="60" y="693" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">C=2H+align(4K,32)；前2H是BF16 partial，尾部是K个weight的位模式。</text><polyline points="800,725 800,765" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,765 794.345448056554,753.2941876694152 805.654551943446,753.2941876694152" fill="#52677d"/><rect x="45" y="765" width="1510" height="160" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="777" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">③ 源 rank：只读 master mask 对应槽</text><text x="60" y="817" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">先 CQ drain + 跨 rank barrier；从 K-1 向0扫描 top-k，seen_ranks 去重，保留各 rank 的最后一槽</text><text x="60" y="847" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">按 bias0 → bias1 → 各 master partial 加载并归约；空槽不参与，不要求整个窗口预清零</text><text x="60" y="877" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">weights：每个 j 仅一个 rank 非零，OR bits 恢复；hidden 不在此乘 weights。</text><rect x="45" y="975" width="1510" height="160" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="60" y="987" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">容量与复用</text><text x="60" y="1027" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">主窗口 = align(max(P×M×D_full, min(P,K)×M×C), 2MiB)，另有 workspace、send staging 与输出张量</text><text x="60" y="1056" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">H=7168、K=6、P=8、M=4096：combine 窗口336.75MiB；BF16主窗口hint452MiB</text><text x="60" y="1085" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">同一 buffer 上的前一操作必须建立完成依赖后再安全复用，不能让下一轮覆盖仍被读写的窗口。</text></svg>