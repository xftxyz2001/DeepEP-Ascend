<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" font-family="Microsoft YaHei,Segoe UI,sans-serif"><title>dispatch-layout</title><rect width="100%" height="100%" fill="white"/><text x="45" y="28" dominant-baseline="text-before-edge" font-size="34" font-weight="700" fill="#17324d">Dispatch 从 source-major 到 expert-major</text><text x="45" y="81" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#52677d">示例 P=2、E=4、K=3、M=4、A=2；只有源 rank0 的 token0 路由 [0,1,2]。</text><polyline points="45,1248 1555,1248" fill="none" stroke="#cad5df" stroke-width="2"/><text x="45" y="1260" dominant-baseline="text-before-edge" font-size="17" font-weight="400" fill="#52677d">源码：BufferLayout · dispatch_copy_epilogue.hpp · recv_src_metadata / psum_num_recv_tokens_per_expert</text><text x="45" y="1288" dominant-baseline="text-before-edge" font-size="16" font-weight="400" fill="#52677d">基线 3b25377 · 静态执行依赖示意，位置与长度不表示实测耗时或物理字节比例</text><rect x="45" y="135" width="1510" height="110" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="147" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">① 发送端：rank 去重</text><text x="60" y="187" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">专家0/1在 rank0，专家2/3在 rank1；token0 向 rank0 一份、rank1 一份，不按三个专家发送三份。</text><polyline points="800,245 800,265 410,265 410,285" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="410,285 404.345448056554,273.2941876694152 415.654551943446,273.2941876694152" fill="#52677d"/><polyline points="800,265 1190,265 1190,285" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1190,285 1184.345448056554,273.2941876694152 1195.654551943446,273.2941876694152" fill="#52677d"/><rect x="45" y="285" width="730" height="170" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="297" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">② 目标 rank0 通信窗口 [P,M,D]</text><text x="60" y="337" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">src0 分区：[token0][空][空][空]</text><text x="60" y="366" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">src1 分区：[空][空][空][空]</text><text x="60" y="395" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">地址 = buffer + (source_rank×M + slot)×D</text><polyline points="410,455 410,495" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="410,495 404.345448056554,483.2941876694152 415.654551943446,483.2941876694152" fill="#52677d"/><rect x="45" y="495" width="730" height="155" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="60" y="507" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">③ 逻辑接收流 / metadata</text><text x="60" y="547" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">rank_psum=[1,1]，逻辑流仅一行</text><text x="60" y="575" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">[0, 2, -1 | 0 | 1]</text><text x="60" y="603" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">前三列为 expanded slots，末两列为 global id / master</text><polyline points="410,650 410,690" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="410,690 404.345448056554,678.2941876694152 415.654551943446,678.2941876694152" fill="#52677d"/><rect x="45" y="690" width="730" height="155" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="702" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">④ Expanded recv_x：专家连续布局</text><text x="60" y="742" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">expert0：有效 slot0 / pad slot1</text><text x="60" y="772" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">expert1：有效 slot2 / pad slot3</text><rect x="825" y="285" width="730" height="170" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="840" y="297" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">② 目标 rank1 通信窗口 [P,M,D]</text><text x="840" y="337" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">src0 分区：[token0][空][空][空]</text><text x="840" y="366" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">src1 分区：[空][空][空][空]</text><text x="840" y="395" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">地址 = buffer + (source_rank×M + slot)×D</text><polyline points="1190,455 1190,495" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1190,495 1184.345448056554,483.2941876694152 1195.654551943446,483.2941876694152" fill="#52677d"/><rect x="825" y="495" width="730" height="155" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="840" y="507" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">③ 逻辑接收流 / metadata</text><text x="840" y="547" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">rank_psum=[1,1]，逻辑流仅一行</text><text x="840" y="575" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">[-1, -1, 0 | 0 | 2]</text><text x="840" y="603" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">前三列为 expanded slots，末两列为 global id / master</text><polyline points="1190,650 1190,690" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1190,690 1184.345448056554,678.2941876694152 1195.654551943446,678.2941876694152" fill="#52677d"/><rect x="825" y="690" width="730" height="155" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="840" y="702" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#17324d">④ Expanded recv_x：专家连续布局</text><text x="840" y="742" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">expert2：有效 slot0 / pad slot1</text><text x="840" y="772" dominant-baseline="text-before-edge" font-size="22" font-weight="400" fill="#17324d">expert3：0行（空专家）</text><rect x="45" y="895" width="1510" height="175" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="60" y="907" dominant-baseline="text-before-edge" font-size="24" font-weight="700" fill="#17324d">三个不同的索引，不能互换</text><text x="60" y="947" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">source partition slot：源 rank 的发送条目在某目标窗口分区内的位置</text><text x="60" y="978" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">recv stream row：跳过每源 rank 的容量空洞后，metadata 的行号</text><text x="60" y="1009" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">expanded slot：某 token / expert 对在专家连续输出矩阵中的行号（包含专家间 padding）</text><rect x="45" y="1110" width="1510" height="110" rx="10" fill="#edf1f5" stroke="#778696" stroke-width="2"/><text x="60" y="1122" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">专家 offset 公式</text><text x="60" y="1162" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">start[e]=Σ(j&lt;e)align(count[j],A)；psum[e]=start[e]+count[e]；padding_end[e]=align(psum[e],A)</text></svg>