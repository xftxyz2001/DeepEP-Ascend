<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" font-family="Microsoft YaHei,Segoe UI,sans-serif"><title>token-records</title><rect width="100%" height="100%" fill="white"/><text x="45" y="28" dominant-baseline="text-before-edge" font-size="34" font-weight="700" fill="#17324d">Token record 字节布局</text><text x="45" y="81" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#52677d">B=hidden 字节数，F=2×SF pack 数；图块宽度为示意，偏移数字才是实际字节位置。</text><polyline points="45,1188 1555,1188" fill="none" stroke="#cad5df" stroke-width="2"/><text x="45" y="1200" dominant-baseline="text-before-edge" font-size="17" font-weight="400" fill="#52677d">源码：layout/ep/token.hpp · TokenLayout；common/compiled.hpp · sf_pack_t / 32B alignment</text><text x="45" y="1228" dominant-baseline="text-before-edge" font-size="16" font-weight="400" fill="#52677d">基线 3b25377 · 静态执行依赖示意，位置与长度不表示实测耗时或物理字节比例</text><text x="45" y="145" dominant-baseline="text-before-edge" font-size="25" font-weight="700" fill="#17324d">非 cached dispatch</text><rect x="45.0" y="190" width="362.5" height="100" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60.0" y="202" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">hidden</text><text x="60.0" y="242" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">B bytes</text><rect x="427.5" y="190" width="362.5" height="100" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="442.5" y="202" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">SF（可选）</text><text x="442.5" y="242" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">align(F,32)</text><rect x="810.0" y="190" width="362.5" height="100" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="825.0" y="202" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">topk_idx</text><text x="825.0" y="242" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">align(8K,32)</text><rect x="1192.5" y="190" width="362.5" height="100" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="1207.5" y="202" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">weights + source id</text><text x="1207.5" y="242" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">4K + 4，尾部补齐</text><text x="45" y="365" dominant-baseline="text-before-edge" font-size="25" font-weight="700" fill="#17324d">Cached dispatch</text><rect x="45.0" y="410" width="490.0" height="100" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60.0" y="422" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">hidden</text><text x="60.0" y="462" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">B bytes</text><rect x="555.0" y="410" width="490.0" height="100" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="570.0" y="422" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">SF（可选）</text><text x="570.0" y="462" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">align(F,32)</text><rect x="1065.0" y="410" width="490.0" height="100" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="1080.0" y="422" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">weights</text><text x="1080.0" y="462" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">align(4K,32)</text><text x="45" y="585" dominant-baseline="text-before-edge" font-size="25" font-weight="700" fill="#17324d">Combine record</text><rect x="45.0" y="630" width="745.0" height="100" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60.0" y="642" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">BF16 partial</text><text x="60.0" y="682" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">2H bytes</text><rect x="810.0" y="630" width="745.0" height="100" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="825.0" y="642" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">top-k weight bits</text><text x="825.0" y="682" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">align(4K,32)</text><text x="45" y="310" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">D_full = B + align(F,32) + align(align(8K,32) + 4K + 4,32)</text><text x="45" y="530" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">D_cached = B + align(F,32) + align(4K,32)；省略 topk_idx 与 source id</text><text x="45" y="750" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">C = 2H + align(4K,32)；weights 可选，但 record 仍保留相同尾部空间</text><rect x="45" y="815" width="1510" height="210" rx="10" fill="#edf1f5" stroke="#778696" stroke-width="2"/><text x="60" y="827" dominant-baseline="text-before-edge" font-size="24" font-weight="700" fill="#17324d">BF16 精确算例：H=7168，K=6，非 cached</text><text x="60" y="867" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">hidden [0,14336)   |   idx [14336,14384)   |   idx 对齐空隙 [14384,14400)</text><text x="60" y="898" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">weights [14400,14424)   |   global id [14424,14428)   |   尾空隙 [14428,14432)</text><text x="60" y="929" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">总长 14432B；cached / combine 均为 14368B。FP8 + 224B SF：full 7488B，cached 7424B。</text><text x="60" y="960" dominant-baseline="text-before-edge" font-size="23" font-weight="400" fill="#17324d">source_global_idx = source_rank × M + token_idx；SF 只运输，不在 dispatch 内量化。</text><rect x="45" y="1065" width="1510" height="95" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="60" y="1077" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">区分 record 与发送队列</text><text x="60" y="1117" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">Dispatch：一条 SQE 最多 6 个 hidden+metadata 对，占 4×64B；Combine：每 token 两个 SGE，占 2×64B。</text></svg>