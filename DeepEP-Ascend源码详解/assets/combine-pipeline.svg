e="#8160b0" stroke-width="2"/><text x="830" y="802" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">MTE3 lock</text><text x="830" y="842" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">UB → GM partial</text><text x="830" y="871" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">store / unlock</text><polyline points="1170,868 1200,868" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1200,868 1188.2941876694151,873.654551943446 1188.2941876694151,862.345448056554" fill="#52677d"/><rect x="1200" y="790" width="355" height="155" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="1215" y="802" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">下一轮 MTE2</text><text x="1215" y="842" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">同槽复用受锁约束</text><text x="1215" y="871" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">避免覆盖未完成消费者</text><rect x="45" y="985" width="1510" height="105" rx="10" fill="#edf1f5" stroke="#778696" stroke-width="2"/><text x="60" y="997" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">归约与直接发送</text><text x="60" y="1037" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">0输入写零；1输入复制；局部2输入走 BF16 add 特例；一般路径 FP32 累加后回 BF16。远端单专家直接发送 x。</text></svg>