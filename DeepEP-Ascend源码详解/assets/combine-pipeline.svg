" font-weight="400" fill="#17324d">MTE3 写 partial / 本地窗口</text><polyline points="865,340 865,390" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="865,390 859.345448056554,378.2941876694152 870.654551943446,378.2941876694152" fill="#52677d"/><rect x="1100" y="190" width="395" height="150" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="1115" y="202" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">读 metadata，生成 WQE</text><text x="1115" y="242" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">有效 slots 压紧 → UB metadata</text><text x="1115" y="270" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">V → S event 通知就绪</text><rect x="1100" y="390" width="395" height="180" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="1115" y="402" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">消费 task n+2</text><text x="1115" y="442" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">等 V → S；按 token 处理</text><text x="1115" y="470" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">MTE2 加载 → V 局部归约</text><text x="1115" y="498" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">MTE3 写 partial / 本地窗口</text><polyline points="1295,340 1295,390" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1295,390 1289.345448056554,378.2941876694152 1300.654551943446,378.2941876694152" fill="#52677d"/><polyline points="635,480 670,480" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="670,480 658.2941876694152,485.654551943446 658.2941876694152,474.345448056554" fill="#52677d"/><polyline points="1065,480 1100,480" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1100,480 1088.2941876694151,485.654551943446 1088.2941876694151,474.345448056554" fill="#52677d"/><rect x="4