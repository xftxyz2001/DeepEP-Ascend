<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" font-family="Microsoft YaHei,Segoe UI,sans-serif"><title>dispatch-epilogue</title><rect width="100%" height="100%" fill="white"/><text x="45" y="28" dominant-baseline="text-before-edge" font-size="34" font-weight="700" fill="#17324d">Dispatch copy epilogue 分阶段流水</text><text x="45" y="81" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#52677d">先建立可读性，再计算专家槽位，最后分批展开；cached 模式直接复用槽位，跳过 histogram/prefix。</text><polyline points="45,1118 1555,1118" fill="none" stroke="#cad5df" stroke-width="2"/><text x="45" y="1130" dominant-baseline="text-before-edge" font-size="17" font-weight="400" fill="#52677d">源码：dispatch_copy_epilogue.hpp · PSumIterator / Atomic &amp; Broadcast Trick / issue_load / padding</text><text x="45" y="1158" dominant-baseline="text-before-edge" font-size="16" font-weight="400" fill="#52677d">基线 3b25377 · 静态执行依赖示意，位置与长度不表示实测耗时或物理字节比例</text><rect x="45" y="135" width="1510" height="100" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="60" y="147" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">① 接收数据就绪</text><text x="60" y="187" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">默认入口：MTE3 flush → Jetty CQ drain → 跨 rank barrier；rank_psum 给出去重接收流长度。</text><polyline points="800,235 800,250 405,250 405,270" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="405,270 399.345448056554,258.2941876694152 410.654551943446,258.2941876694152" fill="#52677d"/><rect x="45" y="270" width="720" height="180" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="60" y="282" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">② 非 cached：建立专家偏移</text><text x="60" y="322" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">每核清零 prefix row → inter-core barrier</text><text x="60" y="351" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">4 × 32KiB histogram stage 统计本核本地专家数</text><text x="60" y="380" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">MTE3 atomic add 广播至后续 AIV 行</text><rect x="805" y="270" width="750" height="180" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="820" y="282" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">③ 非 cached：完成 prefix</text><text x="820" y="322" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">inter-core barrier → 读本核 exclusive prefix</text><text x="820" y="351" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">next_dst[e] = expert_start[e] + earlier_core_count[e]</text><text x="820" y="380" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">各 AIV 对同一专家写互不重叠的连续段</text><polyline points="765,360 805,360" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="805,360 793.2941876694152,365.654551943446 793.2941876694152,354.345448056554" fill="#52677d"/><polyline points="1180,450 1180,470 290,470 290,490" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="290,490 284.345448056554,478.2941876694152 295.654551943446,478.2941876694152" fill="#52677d"/><rect x="45" y="490" width="490" height="190" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="60" y="502" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">④ MTE2 预取</text><text x="60" y="542" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">PSumIterator 跳过 M 容量空洞</text><text x="60" y="570" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">source partition → UB token stage</text><text x="60" y="598" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">目标 stage 约 64KiB</text><rect x="555" y="490" width="490" height="190" rx="10" fill="#e7f0fb" stroke="#3776b4" stroke-width="2"/><text x="570" y="502" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">⑤ S 分配 / 解释槽位</text><text x="570" y="542" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">读 top-k，选本地专家</text><text x="570" y="570" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">非 cached：next_dst[e]++</text><text x="570" y="598" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">cached：metadata[j] 直接给槽</text><rect x="1065" y="490" width="490" height="190" rx="10" fill="#e8f5ef" stroke="#328567" stroke-width="2"/><text x="1080" y="502" dominant-baseline="text-before-edge" font-size="21" font-weight="700" fill="#17324d">⑥ MTE3 批量写出</text><text x="1080" y="542" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">同 hidden / SF 可复制多次</text><text x="1080" y="570" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">写 expanded x、SF、weight</text><text x="1080" y="598" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#17324d">非 cached 写 K+2 列 metadata</text><polyline points="535,585 555,585" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="555,585 543.2941876694152,590.654551943446 543.2941876694152,579.345448056554" fill="#52677d"/><polyline points="1045,585 1065,585" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="1065,585 1053.2941876694151,590.654551943446 1053.2941876694151,579.345448056554" fill="#52677d"/><rect x="45" y="725" width="1510" height="160" rx="10" fill="#fff2dd" stroke="#b57722" stroke-width="2"/><text x="60" y="737" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">Stage 循环的两个关键事件</text><text x="60" y="777" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">MTE2 → S：本 stage 已加载，标量才可读 token；MTE3 → MTE2：本 stage 的消费者已读完，才可覆盖</text><text x="60" y="806" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">metadata 独立双缓冲：MTE3 → S 释放可写槽，S → MTE3 发布待写 metadata</text><text x="60" y="835" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">事件预算：token stages + 2 metadata stages ≤ 8；histogram scratch 在主 copy 阶段复用。</text><polyline points="800,885 800,925" fill="none" stroke="#52677d" stroke-width="3"/><polygon points="800,925 794.345448056554,913.2941876694152 805.654551943446,913.2941876694152" fill="#52677d"/><rect x="45" y="925" width="1510" height="145" rx="10" fill="#f0eafb" stroke="#8160b0" stroke-width="2"/><text x="60" y="937" dominant-baseline="text-before-edge" font-size="22" font-weight="700" fill="#17324d">⑦ Padding 与最终布局</text><text x="60" y="977" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">对每专家 [有效末尾, align(末尾,A)) 的 x / SF / weights 清零，最多分四段处理</text><text x="60" y="1006" dominant-baseline="text-before-edge" font-size="21" font-weight="400" fill="#17324d">不保证 no-CPU-sync 的容量尾部清零；metadata 行序保留 source-major 的逻辑接收顺序。</text></svg>